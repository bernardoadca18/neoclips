services:
  db:
    image: pgvector/pgvector:pg16
    container_name: neoclips-db
    environment:
      POSTGRES_USER: neoclips
      POSTGRES_PASSWORD: neoclips
      POSTGRES_DB: neoclips
    volumes:
      - neoclips-db-data:/var/lib/postgresql/data
    # Port publishing handled by override for integrated deployment
    # Standalone: NEOCLIPS_POSTGRES_HOST_PORT=5436 (avoid conflict with Ideas Hub 5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoclips"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neovids
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neoclips-redis
    volumes:
      - neoclips-redis-data:/data
    # Port publishing handled by override for integrated deployment
    # Standalone: NEOCLIPS_REDIS_HOST_PORT=6381 (avoid conflict with Orchestrator Redis 6379)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neovids
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neoclips-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://neoclips:neoclips@db:5432/neoclips
      REDIS_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-neoclips}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
      MEDIA_INDEXER_BASE_URL: ${MEDIA_INDEXER_BASE_URL:-http://media-indexer:8000}
      MEDIA_INDEXER_TIMEOUT_SECONDS: ${MEDIA_INDEXER_TIMEOUT_SECONDS:-30}
      MEDIA_INDEXER_PROJECT_NAME: ${MEDIA_INDEXER_PROJECT_NAME:-NeoClips Managed Sources}
      MEDIA_INDEXER_INITIAL_INDEX_TIMEOUT_SECONDS: ${MEDIA_INDEXER_INITIAL_INDEX_TIMEOUT_SECONDS:-600}
      MEDIA_INDEXER_TRANSCRIPTION_TIMEOUT_SECONDS: ${MEDIA_INDEXER_TRANSCRIPTION_TIMEOUT_SECONDS:-1800}
      MEDIA_INDEXER_POLL_INTERVAL_SECONDS: ${MEDIA_INDEXER_POLL_INTERVAL_SECONDS:-5}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://9router:20128}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_TIMEOUT_SECONDS: ${NINE_ROUTER_TIMEOUT_SECONDS:-120}
      NINE_ROUTER_DISCOVERY_COMBO: ${NINE_ROUTER_DISCOVERY_COMBO:-neoclips-discovery}
    ports:
      - "${NEOCLIPS_API_PORT:-8020}:8020"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      neovids:
        aliases:
          - neoclips
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neoclips-worker
    command: celery -A app.core.celery_app.celery_app worker -Q ${CELERY_QUEUE_NAME:-neoclips} --concurrency=1 -l info
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://neoclips:neoclips@db:5432/neoclips
      REDIS_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-neoclips}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_INDEXER_BASE_URL: ${MEDIA_INDEXER_BASE_URL:-http://media-indexer:8000}
      MEDIA_INDEXER_TIMEOUT_SECONDS: ${MEDIA_INDEXER_TIMEOUT_SECONDS:-30}
      MEDIA_INDEXER_PROJECT_NAME: ${MEDIA_INDEXER_PROJECT_NAME:-NeoClips Managed Sources}
      MEDIA_INDEXER_INITIAL_INDEX_TIMEOUT_SECONDS: ${MEDIA_INDEXER_INITIAL_INDEX_TIMEOUT_SECONDS:-600}
      MEDIA_INDEXER_TRANSCRIPTION_TIMEOUT_SECONDS: ${MEDIA_INDEXER_TRANSCRIPTION_TIMEOUT_SECONDS:-1800}
      MEDIA_INDEXER_POLL_INTERVAL_SECONDS: ${MEDIA_INDEXER_POLL_INTERVAL_SECONDS:-5}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://9router:20128}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_TIMEOUT_SECONDS: ${NINE_ROUTER_TIMEOUT_SECONDS:-120}
      NINE_ROUTER_DISCOVERY_COMBO: ${NINE_ROUTER_DISCOVERY_COMBO:-neoclips-discovery}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neovids
    restart: unless-stopped

volumes:
  neoclips-db-data:
  neoclips-redis-data:

networks:
  neovids:
    external: true
    name: neovids
