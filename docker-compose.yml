services:
  db:
    image: pgvector/pgvector:pg16
    container_name: neoclips-db
    environment:
      POSTGRES_USER: neoclips
      POSTGRES_PASSWORD: neoclips
      POSTGRES_DB: neoclips
    volumes:
      - neoclips-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoclips"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neoclips-redis
    volumes:
      - neoclips-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neoclips-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://neoclips:neoclips@db:5432/neoclips
      REDIS_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: neoclips
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8020:8020"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neoclips-worker
    command: celery -A app.core.celery_app.celery_app worker -Q neoclips --concurrency=1 -l info
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://neoclips:neoclips@db:5432/neoclips
      REDIS_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: neoclips
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neoclips-db-data:
  neoclips-redis-data:
